syntax = "proto3";

package h2.gateway.v1;

// 本机模拟器或 H2 真机高层遥控的网关服务。
service RobotGateway {
  rpc GetState(Empty) returns (RobotState);
  rpc StartTask(StartTaskRequest) returns (CommandReply);
  rpc StopTask(StopTaskRequest) returns (CommandReply);
  rpc GetTask(TaskQuery) returns (TaskResult);
  rpc TeleopAcquire(Empty) returns (TeleopReply);
  rpc TeleopCommand(TeleopCommandRequest) returns (TeleopReply);
  rpc TeleopRelease(TeleopReleaseRequest) returns (TeleopReply);
}

message Empty {}

message Point {
  string id = 1;
  string label = 2;
  double x = 3;
  double y = 4;
}

message StartTaskRequest {
  string task_id = 1;
  string command_id = 2;
  int64 expires_at_ms = 3;
  repeated Point points = 4;
}

message StopTaskRequest {
  string task_id = 1;
  string command_id = 2;
  int64 expires_at_ms = 3;
}

message TaskQuery { string task_id = 1; }

message CommandReply {
  bool accepted = 1;
  string code = 2;
  string message = 3;
  string task_id = 4;
  string command_id = 5;
  bool simulated = 6;
}

message Pose {
  double x = 1;
  double y = 2;
  // 模拟平面上的角度以弧度表示，沿 +x 为零，朝 +y 转动为正。
  double yaw = 3;
  // 机体系速度模长（m/s），真机来自 DDS 里程计 velocity 字段。位置不被这台
  // 固件的估计器积分（2026-11-22 实测），但速度字段有读数，演示执行器用它
  // 判断「指令在发而机器人没在走」的停滞。模拟网关与旧网关缺省为 0。
  optional double speed = 4;
}

message RobotState {
  string robot_id = 1;
  string status = 2;
  string task_id = 3;
  double progress = 4;
  int64 sequence = 5;
  // 引擎收到实时电量读数时才提供该字段，真机数据来自 bmsstate。
  optional double battery_percent = 6;
  Pose pose = 7;
  bool simulated = 8;
  int64 start_count = 9;
  string task_status = 10;
  string updated_at = 11;
  bool teleop_active = 12;
  string motion = 13;
  bool teleop_ready = 14;
  optional int32 fsm_id = 15;
  optional int32 fsm_mode = 16;
  // 环境读数来自 PC2 的 RS-485 传感器代理，过期后省略。
  optional double temperature_c = 17;
  optional double humidity_percent = 18;
  // PC2 原始采样时间，以 Unix 秒表示，用于显示和诊断。
  optional double environment_captured_at = 19;
  optional uint32 environment_remaining_ms = 20;
  optional string environment_sample_id = 21;
}

message TeleopCommandRequest {
  string token = 1;
  int64 sequence = 2;
  string action = 3;
  int64 expires_at_ms = 4;  // 仅用于模拟器，采用上位机的 Unix 时间。
  optional int64 gateway_deadline_ms = 5;  // 仅用于真机，采用 PC3 的单调时钟。
}

message TeleopReleaseRequest { string token = 1; }

message TeleopReply {
  bool accepted = 1;
  string code = 2;
  string message = 3;
  string token = 4;
  optional int64 gateway_monotonic_ms = 5;
}

message Sample {
  string point_id = 1;
  string label = 2;
  string device_id = 3;
  double temperature_c = 4;
  double humidity_percent = 5;
  bytes image_png = 6;
  string captured_at = 7;
  bool simulated = 8;
  double x = 9;
  double y = 10;
}

message TaskResult {
  string task_id = 1;
  string status = 2;
  double progress = 3;
  repeated Sample samples = 4;
  string reason = 5;
  bool simulated = 6;
  int64 sequence = 7;
  string updated_at = 8;
}
